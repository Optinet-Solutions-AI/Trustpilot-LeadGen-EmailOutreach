<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="OptiRate optimization equalizer — sliders tuned upward">
  <defs>
    <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF3FE"/><stop offset="1" stop-color="#DCE6FB"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1E3A8A" flood-opacity="0.18"/></filter>
    <filter id="ksh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E3A8A" flood-opacity="0.28"/></filter>
  </defs>

  <rect width="720" height="460" fill="url(#bgg)"/>

  <!-- console card -->
  <rect x="74" y="62" width="572" height="336" rx="26" fill="#FFFFFF" filter="url(#sh)"/>
  <circle cx="108" cy="96" r="5" fill="#C7D5F5"/><circle cx="124" cy="96" r="5" fill="#C7D5F5"/><circle cx="140" cy="96" r="5" fill="#C7D5F5"/>

  <!-- upward trend connecting the knobs -->
  <polyline points="170,300 268,262 366,222 464,178 562,134" fill="none" stroke="#9DC0FB" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M548 126 L566 132 L560 150" fill="none" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- slider tracks -->
  <g stroke="#D7E3FB" stroke-width="9" stroke-linecap="round">
    <line x1="170" y1="138" x2="170" y2="350"/>
    <line x1="268" y1="138" x2="268" y2="350"/>
    <line x1="366" y1="138" x2="366" y2="350"/>
    <line x1="464" y1="138" x2="464" y2="350"/>
    <line x1="562" y1="138" x2="562" y2="350"/>
  </g>
  <!-- active level (knob → bottom) -->
  <g stroke="#2563EB" stroke-width="9" stroke-linecap="round">
    <line x1="170" y1="300" x2="170" y2="350"/>
    <line x1="268" y1="262" x2="268" y2="350"/>
    <line x1="366" y1="222" x2="366" y2="350"/>
    <line x1="464" y1="178" x2="464" y2="350"/>
    <line x1="562" y1="134" x2="562" y2="350"/>
  </g>
  <!-- knobs -->
  <g filter="url(#ksh)">
    <circle cx="170" cy="300" r="16" fill="url(#kb)"/>
    <circle cx="268" cy="262" r="16" fill="url(#kb)"/>
    <circle cx="366" cy="222" r="16" fill="url(#kb)"/>
    <circle cx="464" cy="178" r="16" fill="url(#kb)"/>
    <circle cx="562" cy="134" r="16" fill="url(#kb)"/>
  </g>
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="164" cy="294" r="4.5"/><circle cx="262" cy="256" r="4.5"/><circle cx="360" cy="216" r="4.5"/><circle cx="458" cy="172" r="4.5"/><circle cx="556" cy="128" r="4.5"/>
  </g>
</svg>
